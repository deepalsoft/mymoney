<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Money">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>My Money</title>
<script>
/* ===== Offline layer: replaces google.script.run =====
   - keeps a full copy of your data on the phone (IndexedDB)
   - saves instantly, even with no internet
   - queues changes and sends them to your Google Sheet when online */
(function () {
  const H = {
    Categories: ['ID','Type','Name','Budget','Order','LoanID','CardID'],
    Accounts: ['ID','Name','Parent','Type','Opening','Currency','Target','Order','Limit','StmtDay','PayDay'],
    Transactions: ['ID','Date','Type','Category','Account','ToAccount','Amount','Note','Rate','ToAmount','Photo'],
    Goals: ['ID','Name','Target','Saved','TargetDate','Account'],
    Settings: ['ID','Value'],
    Rates: ['ID','Date','Buy','Sell'],
    Loans: ['ID','Person','Direction','Amount','Date','DueDate','Account','Note','Rate','Installment','Freq','FirstInst','LoanType'],
    LoanPayments: ['ID','LoanID','Date','Amount','Account','Note','TxID'],
    AccBudgets: ['ID','Category','Account','Amount','DueDay'],
    Assets: ['ID','Kind','Name','Code'],
    InvTx: ['ID','AssetID','Date','Type','Units','Price','Fees','Amount','Account','Note'],
    Prices: ['ID','AssetID','Date','Price'],
    FDs: ['ID','Name','Principal','Rate','StartDate','TermMonths','Payout','Account','Note','Closed'],
    BudgetLog: ['ID','Kind','Category','Account','Amount','From'],
    CardPay: ['ID','Card','Date','Amount','TxID','Note'],
    CardPlans: ['ID','Card','Item','Total','Months','Start','Note','Closed'],
    Trips: ['ID','Name','Destination','Start','End','Account','PerHead','Status','Note'],
    TripMembers: ['ID','TripID','Name','Expected','Phone','Note'],
    TripPay: ['ID','TripID','Member','Date','Amount','Account','Kind','Note'],
    TripBudget: ['ID','TripID','Item','Category','Amount','Note'],
    TripExp: ['ID','TripID','Date','Item','Category','Amount','Account','BudgetItem','Kind','Member','Status','Note']
  };
  const VER = 'v20';
  const LS = window.localStorage;
  const cfg = () => ({ url: LS.getItem('mm_url') || '', key: LS.getItem('mm_key') || '' });
  const newId = () => Array.from(crypto.getRandomValues(new Uint8Array(4))).map(b => b.toString(16).padStart(2, '0')).join('');
  const clone = o => JSON.parse(JSON.stringify(o));

  /* ---- tiny IndexedDB key-value store ---- */
  const idb = new Promise((res, rej) => {
    const r = indexedDB.open('mymoney', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const kvGet = k => idb.then(db => new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }));
  const kvSet = (k, v) => idb.then(db => new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }));

  let data = null, queue = [], photos = {}, failed = [], syncing = false;
  const ready = Promise.all([kvGet('data'), kvGet('queue'), kvGet('photos'), kvGet('failed')]).then(([d, q, p, f]) => {
    data = d || null; queue = q || []; photos = p || {}; failed = f || [];
  }).catch(() => {});
  const persist = () => Promise.all([kvSet('data', data), kvSet('queue', queue), kvSet('photos', photos), kvSet('failed', failed)]).catch(() => {});

  /* ---- status pill ---- */
  const pill = document.createElement('div');
  pill.style.cssText = 'position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);right:8px;z-index:99;font:600 12px system-ui,sans-serif;padding:5px 10px;border-radius:99px;display:none;box-shadow:0 1px 6px rgba(0,0,0,.25);cursor:pointer';
  pill.onclick = () => sync(true);
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(pill));
  function status() {
    const off = !navigator.onLine, n = queue.length;
    if (syncing) { pill.textContent = '⟳ Syncing…'; pill.style.background = '#0f766e'; pill.style.color = '#fff'; pill.style.display = 'block'; }
    else if (failed.length) { pill.textContent = '⚠ ' + failed.length + ' change(s) rejected – tap'; pill.style.background = '#b91c1c'; pill.style.color = '#fff'; pill.style.display = 'block'; }
    else if (off || n) { pill.textContent = (off ? '● Offline' : '● Not synced') + (n ? ' · ' + n + ' waiting' : ''); pill.style.background = '#b45309'; pill.style.color = '#fff'; pill.style.display = 'block'; }
    else pill.style.display = 'none';
  }

  /* ---- setup screen (URL + key are kept on this phone only) ---- */
  function setup(msg) {
    return new Promise(resolve => {
      const w = document.createElement('div');
      w.style.cssText = 'position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;font-family:system-ui,sans-serif';
      const c = cfg();
      w.innerHTML = `<div style="background:#fff;color:#16302b;border-radius:14px;padding:18px;max-width:420px;width:100%">
        <h3 style="margin:0 0 6px">Connect to your Google Sheet <span style="font-weight:400;font-size:12px;color:#6b7f7a">(app ${VER})</span></h3>
        <div id="mmmsg" style="font-size:13px;color:#b91c1c;margin-bottom:6px">${msg || ''}</div>
        <label style="font-size:13px">Web App URL</label>
        <input id="mmu" style="width:100%;box-sizing:border-box;padding:10px;margin:4px 0 10px;border:1px solid #ccc;border-radius:8px" placeholder="https://script.google.com/macros/s/…/exec" value="${c.url}">
        <label style="font-size:13px">Access key</label>
        <input id="mmk" type="password" style="width:100%;box-sizing:border-box;padding:10px;margin:4px 0 14px;border:1px solid #ccc;border-radius:8px" value="${c.key}">
        <button id="mmok" style="width:100%;padding:12px;border:0;border-radius:10px;background:#0f766e;color:#fff;font-size:16px">Save</button>
        ${c.url ? '<button id="mmx" style="width:100%;padding:10px;border:0;background:none;color:#6b7f7a;margin-top:6px">Cancel</button>' : ''}</div>`;
      document.body.appendChild(w);
      w.querySelector('#mmok').onclick = async () => {
        const u = w.querySelector('#mmu').value.trim(), k = w.querySelector('#mmk').value.trim(), m = w.querySelector('#mmmsg'), b = w.querySelector('#mmok');
        if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(u) || !k) { m.textContent = 'Enter the full Web App URL (ends with /exec) and your access key.'; return; }
        LS.setItem('mm_url', u); LS.setItem('mm_key', k);
        b.disabled = true; b.textContent = 'Testing connection…'; m.textContent = '';
        try { data = await rpc('getAll', []); await persist(); w.remove(); resolve(true); }       // the test also downloads your data
        catch (e) { b.disabled = false; b.textContent = 'Save'; m.textContent = (e.unauth ? 'Access key does not match API_KEY in Code.gs (or API_KEY is still CHANGE-THIS-SECRET and not redeployed).' : e.message); }
      };
      const x = w.querySelector('#mmx'); if (x) x.onclick = () => { w.remove(); resolve(false); };
    });
  }
  window.mmSettings = () => setup('').then(ok => ok && sync(true));

  /* ---- talk to Apps Script ---- */
  async function rpc(fn, args) {
    const c = cfg();
    if (!c.url) { const e = new Error('Not configured'); e.net = true; throw e; }
    if (!navigator.onLine) { const e = new Error('Offline'); e.net = true; throw e; }
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), fn === 'uploadPhoto' ? 60000 : 20000);
    let j, r;
    try {
      r = await fetch(c.url, { method: 'POST', body: JSON.stringify({ key: c.key, fn, args }), signal: ctl.signal, redirect: 'follow' });
    } catch (x) {
      const e = new Error('Could not reach the Web App. Check the URL, your internet, and that "Who has access" is set to Anyone.'); e.net = true; e.detail = e.message; throw e;
    } finally { clearTimeout(to); }
    try { j = await r.json(); }
    catch (x) {
      const e = new Error('The Web App answered but not with data (HTTP ' + r.status + '). Use the URL ending in /exec, set "Who has access" to Anyone, and deploy a New version.'); e.net = true; e.detail = e.message; throw e;
    }
    if (!j.ok) {
      const e = new Error(j.error || 'Server error'); e.app = true;
      if (j.error === 'Unauthorized') e.unauth = true;
      throw e;
    }
    return j.result;
  }

  /* ---- the same logic as Code.gs, applied to the local copy ---- */
  const T = () => { Object.keys(H).forEach(k => { if (!data[k]) data[k] = []; }); return data; };
  const upsert = (name, o) => {
    const row = {}; H[name].forEach(k => row[k] = (o[k] === undefined || o[k] === null) ? '' : o[k]);
    const i = T()[name].findIndex(r => r.ID === row.ID);
    if (i >= 0) T()[name][i] = row; else T()[name].push(row);
  };
  const dropWhere = (name, key, val) => { T()[name] = T()[name].filter(r => r[key] !== val); };
  const nowYm = () => { const n = new Date(); return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0'); };
  const nextYm = ym => { const d = new Date(+ym.slice(0, 4), +ym.slice(5, 7), 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
  const fm = r => String(r.From).slice(0, 7);
  const effOf = (rows, ym) => { let v = null; rows.slice().sort((a, b) => fm(a) < fm(b) ? -1 : 1).forEach(r => { if (fm(r) <= ym) v = +r.Amount || 0; }); return v; };
  const keyRows = (kind, cat, acct) => T().BudgetLog.filter(r => r.Kind === kind && r.Category === cat && String(r.Account || '') === String(acct || ''));
  const effBudget = (kind, cat, acct, ym, fb) => { const v = effOf(keyRows(kind, cat, acct), ym); return v === null ? (+fb || 0) : v; };
  function logBudget(kind, cat, acct, fallback, newAmt, from, single) {   // single: only that month changes; else from that month onward
    fallback = +fallback || 0; newAmt = +newAmt || 0; from = /^\d{4}-\d{2}$/.test(from || '') ? from : nowYm();
    const rows = keyRows(kind, cat, acct), eff = effOf(rows, from), cur0 = eff === null ? fallback : eff;
    if (cur0 === newAmt) return;
    const add = (f, a) => { const hit = rows.find(r => fm(r) === f); if (hit) hit.Amount = a; else { const r = { ID: newId(), Kind: kind, Category: cat, Account: acct || '', Amount: a, From: f }; T().BudgetLog.push(r); rows.push(r); } };
    if (!rows.length) add('0000-00', fallback);
    if (single) { const nx = nextYm(from); if (!rows.some(r => fm(r) === nx)) { const en = effOf(rows, nx), effNext = en === null ? fallback : en; if (effNext !== newAmt) add(nx, effNext); } }
    add(from, newAmt);
  }
  const L = {
    save(name, o) { o.ID = o.ID || newId(); upsert(name, o); },
    remove(name, id) {
      const row = T()[name].find(r => r.ID === id);
      if (name === 'Transactions' && row && String(row.Photo).indexOf('pending-') === 0) cancelPhoto(row.Photo);
      if (name === 'Transactions') { dropWhere('LoanPayments', 'TxID', id); dropWhere('CardPay', 'TxID', id); }
      dropWhere(name, 'ID', id);
      if (name === 'Trips') ['TripMembers', 'TripPay', 'TripBudget', 'TripExp'].forEach(n => dropWhere(n, 'TripID', id));
      if (name === 'Loans') dropWhere('LoanPayments', 'LoanID', id);
      if (name === 'Assets') { dropWhere('InvTx', 'AssetID', id); dropWhere('Prices', 'AssetID', id); }
    },
    reorder(name, ids) { ids.forEach((id, k) => { const r = T()[name].find(x => x.ID === id); if (r) r.Order = k + 1; }); },
    saveTransaction(o, links) {
      o.ID = o.ID || newId(); links = links || {};
      upsert('Transactions', Object.assign({}, o));
      dropWhere('LoanPayments', 'ID', 'lp' + o.ID); dropWhere('CardPay', 'ID', 'cp' + o.ID);
      if (links.loan) upsert('LoanPayments', { ID: 'lp' + o.ID, LoanID: links.loan.id, Date: o.Date, Amount: Number(links.loan.lkr) || 0, Account: '', Note: o.Note || 'Paid from expense', TxID: o.ID });
      if (links.card) upsert('CardPay', { ID: 'cp' + o.ID, Card: links.card.name, Date: o.Date, Amount: Number(links.card.amt) || 0, TxID: o.ID, Note: o.Note || 'Payment' });
    },
    saveCategory(o, from) {
      o.ID = o.ID || newId();                                   // the id is shared with the queued call on purpose
      const cur = nowYm(); from = /^\d{4}-\d{2}$/.test(from || '') ? from : cur;
      const old = T().Categories.find(c => c.ID === o.ID), newB = +o.Budget || 0, row = Object.assign({}, o);
      if (old) {
        const oldB = +old.Budget || 0, changed = effBudget('cat', o.Name, '', from, oldB) !== newB, past = from < cur;
        if (!changed || past) row.Budget = oldB;               // today's figure stays unless the change is for this month or later
        upsert('Categories', row);
        if (changed) logBudget('cat', o.Name, '', oldB, newB, from, past);
      } else { upsert('Categories', row); logBudget('cat', o.Name, '', 0, newB, from, false); }
    },
    saveAccBudget(categoryId, account, amount, dueDay, from) {
      const cat = T().Categories.find(c => c.ID === categoryId); if (!cat) throw new Error('Category not found');
      const cur = nowYm(); from = /^\d{4}-\d{2}$/.test(from || '') ? from : cur;
      const amt = Number(amount) || 0;
      let dd = Math.round(Number(dueDay)) || 0; if (dd < 1 || dd > 31) dd = 0;
      const oldCat = +cat.Budget || 0, oldRow = T().AccBudgets.find(r => r.Category === cat.Name && r.Account === account), oldAmt = oldRow ? +oldRow.Amount || 0 : 0;
      if (from < cur && oldRow) {                                // an earlier month: change only that month
        const effAcc = effBudget('acc', cat.Name, account, from, oldAmt), effCat = effBudget('cat', cat.Name, '', from, oldCat);
        if (effAcc !== amt) { logBudget('acc', cat.Name, account, oldAmt, amt, from, true); logBudget('cat', cat.Name, '', oldCat, Math.max(0, effCat - effAcc + amt), from, true); }
        if (dd !== (+oldRow.DueDay || 0)) oldRow.DueDay = dd || '';
        return;
      }
      if (from < cur) from = cur;
      T().AccBudgets = T().AccBudgets.filter(r => !(r.Category === cat.Name && r.Account === account));
      if (amt > 0 || dd > 0) T().AccBudgets.push({ ID: newId(), Category: cat.Name, Account: account, Amount: amt, DueDay: dd || '' });
      const total = T().AccBudgets.filter(r => r.Category === cat.Name).reduce((s, r) => s + (Number(r.Amount) || 0), 0);
      logBudget('acc', cat.Name, account, oldAmt, amt, from, false);
      if (total > 0) { cat.Budget = total; logBudget('cat', cat.Name, '', oldCat, total, from, false); }
    },
    addAsset(asset, opening) {
      asset.ID = asset.ID || newId();
      if (T().Assets.some(a => a.ID === asset.ID)) return;
      T().Assets.push({ ID: asset.ID, Kind: asset.Kind, Name: asset.Name, Code: asset.Code || '' });
      const o = opening || {}, units = Number(o.units) || 0, avg = Number(o.avg) || 0;
      if (units > 0 && avg > 0) T().InvTx.push({ ID: newId(), AssetID: asset.ID, Date: o.date, Type: 'Buy', Units: units, Price: avg, Fees: 0, Amount: Math.round(units * avg * 100) / 100, Account: '', Note: 'Existing holding' });
      const price = Number(o.price) || 0;
      if (price > 0) T().Prices.push({ ID: newId(), AssetID: asset.ID, Date: o.priceDate || o.date, Price: price });
    },
    savePrices(date, items) {
      (items || []).forEach(it => {
        const price = Number(it.price) || 0; if (price <= 0) return;
        const r = T().Prices.find(p => p.AssetID === it.assetId && String(p.Date) === date);
        if (r) r.Price = price; else T().Prices.push({ ID: newId(), AssetID: it.assetId, Date: date, Price: price });
      });
    }
  };
  const MUTATING = ['save', 'remove', 'reorder', 'saveAccBudget', 'saveCategory', 'saveTransaction', 'addAsset', 'savePrices'];

  function cancelPhoto(pid) {
    queue = queue.filter(q => q.pending !== pid);
    delete photos[pid];
  }

  /* ---- background refresh: download the sheet, update the screen only if something changed ---- */
  async function pull() {
    const fresh = await rpc('getAll', []);
    if (queue.length) return;                              // newer local changes are waiting: keep them
    const changed = JSON.stringify(fresh) !== JSON.stringify(data);
    data = fresh; await persist();
    if (changed) window.dispatchEvent(new Event('mm-synced'));
  }
  let pulling = false;
  const pullSoon = () => { if (pulling || syncing || !navigator.onLine || !cfg().url) return; pulling = true; pull().catch(() => {}).finally(() => { pulling = false; status(); }); };

  /* ---- sync the waiting changes ---- */
  const swap = (obj, map) => { let s = JSON.stringify(obj); Object.keys(map).forEach(k => { s = s.split(k).join(map[k]); }); return JSON.parse(s); };
  async function sync(manual) {
    if (syncing) return;
    if (failed.length && manual) {
      alert('These changes were rejected by the sheet and were not saved:\n\n' + failed.map(f => '• ' + f.fn + ': ' + f.error).join('\n'));
      failed = []; await persist(); status(); return;
    }
    if (!cfg().url || !navigator.onLine) { status(); return; }
    syncing = true; status();
    const map = {};
    try {
      while (queue.length) {
        const item = queue[0];
        const args = swap(item.args, map);
        try {
          const r = await rpc(item.fn, args);
          if (item.fn === 'uploadPhoto' && item.pending) {
            map[item.pending] = r;
            T().Transactions.forEach(t => { if (t.Photo === item.pending) t.Photo = r; });
            delete photos[item.pending];
          }
          queue.shift(); await persist();
        } catch (e) {
          if (e.net) throw e;
          if (e.unauth) throw e;
          failed.push({ fn: item.fn, error: e.message }); queue.shift(); await persist();
        }
      }
      await pull();                           // server copy is the truth once everything is sent
    } catch (e) {
      if (e.unauth) { LS.setItem('mm_key', ''); syncing = false; status(); if (await setup('Access key was rejected. Enter it again.')) sync(true); return; }
    } finally { syncing = false; status(); }
  }

  /* ---- the functions the app calls ---- */
  const impl = {
    async getAll() {
      if (!cfg().url) { await setup('First time: paste the URL of your Apps Script Web App and your access key.'); }
      if (data) { pullSoon(); status(); return clone(data); }      // instant start from the copy on the phone
      if (queue.length) await sync();
      if (!queue.length) {
        try { data = await rpc('getAll', []); await persist(); status(); return clone(data); }
        catch (e) {
          if (e.unauth) { LS.setItem('mm_key', ''); await setup('Access key was rejected. Enter it again.'); return impl.getAll(); }
          if (!e.net) throw e;
          if (!data) {                                   // nothing saved yet and the server cannot be reached: say why
            if (await setup(e.message + ' Fix the URL/key below, or Cancel.')) return impl.getAll();
            throw new Error(e.message);
          }
        }
      }
      if (!data) throw new Error('[app ' + VER + '] No saved data yet. Open the app once with internet to download your data.');
      status(); return clone(data);
    },
    async uploadPhoto(url, name) {
      if (!queue.length) { try { return await rpc('uploadPhoto', [url, name]); } catch (e) { if (!e.net) throw e; } }
      const pid = 'pending-' + newId();
      photos[pid] = url; queue.push({ fn: 'uploadPhoto', args: [url, name], pending: pid });
      await persist(); status(); return pid;
    },
    async getPhoto(id) {
      if (String(id).indexOf('pending-') === 0) { if (photos[id]) return photos[id]; throw new Error('Photo is not on this phone'); }
      return rpc('getPhoto', [id]);
    },
    async deletePhoto(id) {
      if (String(id).indexOf('pending-') === 0) { cancelPhoto(id); await persist(); status(); return; }
      queue.push({ fn: 'deletePhoto', args: [id] }); await persist(); status(); sync();
    }
  };
  MUTATING.forEach(fn => {
    impl[fn] = async (...args) => {
      if (!data) throw new Error('No saved data yet. Open the app once with internet first.');
      const before = clone(data);
      L[fn](...args);                                    // 1) change the local copy right away
      queue.push({ fn, args }); persist(); status();         // 2) wait in the queue (saved to the phone in the background) ...
      sync();                                                // 3) ... and send in the background (no waiting on the screen)
      return clone(data);
    };
  });

  /* ---- google.script.run look-alike ---- */
  let chain = Promise.resolve();
  const api = (name, args) => {
    const p = chain.then(() => ready).then(() => { if (!impl[name]) throw new Error('Unknown function ' + name); return impl[name](...args); });
    chain = p.catch(() => {});
    return p;
  };
  const runner = () => {
    let ok = () => {}, bad = () => {};
    const o = new Proxy({}, { get(_, n) {
      if (n === 'withSuccessHandler') return f => { ok = f; return o; };
      if (n === 'withFailureHandler') return f => { bad = f; return o; };
      return (...a) => { api(n, a).then(r => ok(r), e => bad(e)); };
    } });
    return o;
  };
  window.google = { script: { run: new Proxy({}, { get: (_, n) => runner()[n] }) } };

  /* ---- automatic sync + refresh ---- */
  window.addEventListener('online', () => sync());
  window.addEventListener('offline', status);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
  setInterval(() => { if (queue.length) sync(); }, 30000);
  window.addEventListener('mm-synced', () => {
    if (typeof M !== 'undefined' && M) return;          // do not disturb an open form
    if (typeof setData === 'function' && typeof render === 'function') { setData(clone(data)); render(); }
  });
  ready.then(status);
})();


/* ===== App lock: PIN + Face ID / Touch ID (this phone only) ===== */
(function () {
  const LS = window.localStorage;
  const get = () => { try { return JSON.parse(LS.getItem('mm_lock') || 'null'); } catch (e) { return null; } };
  const put = o => o ? LS.setItem('mm_lock', JSON.stringify(o)) : LS.removeItem('mm_lock');
  const hex = b => Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
  const b64 = b => btoa(String.fromCharCode.apply(null, new Uint8Array(b))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const unb64 = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
  const rnd = n => crypto.getRandomValues(new Uint8Array(n));
  const sha = async (salt, pin) => hex(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin)));
  const canBio = () => !!(window.PublicKeyCredential && navigator.credentials);
  let locked = false, hiddenAt = 0, fails = 0, until = 0, pin = '';

  const st = document.createElement('style');
  st.textContent = 'html.mml body>*:not(#mmlock):not(#mmset){visibility:hidden!important}' +
    '#mmlock,#mmset{position:fixed;inset:0;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center}' +
    '#mmlock{z-index:500;background:linear-gradient(160deg,#0f766e,#134e4a);color:#fff}#mmset{z-index:400;background:rgba(0,0,0,.55);padding:20px}' +
    '#mmlock h2{margin:0 0 4px;font-size:22px}#mmlock .msg{height:20px;font-size:13px;opacity:.85;margin:6px 0 14px}' +
    '#mmlock .pd{display:flex;gap:14px;margin:8px 0 6px}#mmlock .pd i{width:14px;height:14px;border-radius:50%;border:2px solid #fff}#mmlock .pd i.f{background:#fff}' +
    '#mmlock .kp{display:grid;grid-template-columns:repeat(3,76px);gap:14px;margin-top:6px}#mmlock .kp button{height:76px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:28px}' +
    '#mmlock .kp button:active{background:rgba(255,255,255,.35)}#mmlock .bio{margin-top:18px;background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:99px;padding:9px 20px;font-size:15px}' +
    '@keyframes mmshake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}#mmlock .pd.bad{animation:mmshake .35s}' +
    '#mmset .box{background:#fff;color:#16302b;border-radius:16px;padding:18px;max-width:380px;width:100%;max-height:90vh;overflow:auto}' +
    '#mmset input,#mmset select{width:100%;box-sizing:border-box;padding:11px;margin:4px 0 10px;border:1px solid #cbd5d1;border-radius:8px;font-size:16px}' +
    '#mmset button{width:100%;padding:12px;border:0;border-radius:10px;background:#0f766e;color:#fff;font-size:16px;margin-top:6px}#mmset button.g{background:#e6efed;color:#16302b}#mmset button.r{background:#b91c1c}';
  document.head.appendChild(st);
  if (get()) document.documentElement.classList.add('mml');

  async function bio() {
    const L = get(); if (!L || !L.cred) return false;
    try {
      await navigator.credentials.get({ publicKey: { challenge: rnd(32), allowCredentials: [{ type: 'public-key', id: unb64(L.cred) }], userVerification: 'required', timeout: 60000 } });
      return true;
    } catch (e) { return false; }
  }
  function dots() { const d = document.querySelector('#mmlock .pd'); if (d) d.innerHTML = Array.from({ length: (get() || {}).len || 4 }, (_, i) => '<i class="' + (i < pin.length ? 'f' : '') + '"></i>').join(''); }
  function show() {
    const L = get(); if (!L) return;
    locked = true; pin = ''; document.documentElement.classList.add('mml');
    let o = document.getElementById('mmlock'); if (o) o.remove();
    o = document.createElement('div'); o.id = 'mmlock';
    o.innerHTML = '<h2>🔒 My Money</h2><div class="msg" id="mmmsg2">Enter your PIN</div><div class="pd"></div><div class="kp">' +
      [1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, '⌫'].map(k => k === '' ? '<span></span>' : '<button data-k="' + k + '">' + k + '</button>').join('') + '</div>' +
      (L.cred ? '<button class="bio" id="mmbio">Use Face ID</button>' : '');
    document.body.appendChild(o); dots();
    o.querySelectorAll('.kp button').forEach(b => b.onclick = () => key(b.dataset.k));
    const bb = document.getElementById('mmbio'); if (bb) bb.onclick = async () => { if (await bio()) unlock(); else msg('Face ID failed. Use your PIN.'); };
    if (L.cred) bio().then(ok => { if (ok) unlock(); });
  }
  const msg = t => { const m = document.getElementById('mmmsg2'); if (m) m.textContent = t; };
  function unlock() { locked = false; fails = 0; const o = document.getElementById('mmlock'); if (o) o.remove(); document.documentElement.classList.remove('mml'); }
  async function key(k) {
    const L = get(); if (!L) return unlock();
    if (Date.now() < until) { msg('Too many tries. Wait ' + Math.ceil((until - Date.now()) / 1000) + 's'); return; }
    if (k === '⌫') pin = pin.slice(0, -1); else if (pin.length < L.len) pin += k;
    dots();
    if (pin.length === L.len) {
      if (await sha(L.salt, pin) === L.hash) { unlock(); return; }
      fails++; pin = ''; const d = document.querySelector('#mmlock .pd'); d.classList.add('bad'); setTimeout(() => { d.classList.remove('bad'); dots(); }, 400);
      if (fails >= 5) { until = Date.now() + 30000; fails = 0; msg('Too many tries. Wait 30s'); } else msg('Wrong PIN');
    }
  }
  document.addEventListener('DOMContentLoaded', () => { if (get()) show(); });
  document.addEventListener('visibilitychange', () => {
    const L = get(); if (!L) return;
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (!locked && Date.now() - hiddenAt >= (L.auto || 0) * 1000) show();
  });

  /* ---- settings ---- */
  window.mmLockSettings = () => {
    const L = get(), w = document.createElement('div'); w.id = 'mmset';
    const close = () => w.remove(), val = id => w.querySelector('#' + id).value.trim();
    const err = t => { w.querySelector('#mmerr').textContent = t; };
    const okPin = p => /^\d{4,6}$/.test(p);
    const setPin = async p => { const salt = Array.from(rnd(8)).join(''); return { salt, hash: await sha(salt, p), len: p.length }; };
    w.innerHTML = '<div class="box"><h3 style="margin:0 0 6px">🔒 App lock</h3><div id="mmerr" style="color:#b91c1c;font-size:13px;min-height:16px"></div>' + (L ? `
      <label>Ask for PIN after leaving the app</label><select id="mmauto">${[[0, 'Immediately'], [60, 'After 1 minute'], [300, 'After 5 minutes'], [900, 'After 15 minutes']].map(o => `<option value="${o[0]}" ${(L.auto || 0) === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>
      ${canBio() ? `<button class="g" id="mmbio2">${L.cred ? 'Turn off Face ID' : 'Turn on Face ID / Touch ID'}</button>` : ''}
      <label style="display:block;margin-top:12px">Current PIN (needed to change or turn off)</label><input id="mmcur" type="password" inputmode="numeric" maxlength="6">
      <label>New PIN (4–6 digits, optional)</label><input id="mmnew" type="password" inputmode="numeric" maxlength="6">
      <button id="mmsave">Save</button><button class="r" id="mmoff">Turn off app lock</button>` : `
      <div style="font-size:13px;color:#51706a;margin-bottom:8px">Choose a PIN. You can add Face ID afterwards.</div>
      <label>PIN (4–6 digits)</label><input id="mmnew" type="password" inputmode="numeric" maxlength="6"><label>Repeat PIN</label><input id="mmnew2" type="password" inputmode="numeric" maxlength="6">
      <button id="mmon">Turn on app lock</button>`) + '<button class="g" id="mmx">Close</button><div style="font-size:12px;color:#6b7f7a;margin-top:10px">This locks the screen of this app on this phone. Your data is not encrypted.</div></div>';
    document.body.appendChild(w);
    w.querySelector('#mmx').onclick = close;
    if (!L) { w.querySelector('#mmon').onclick = async () => { const p = val('mmnew'); if (!okPin(p)) return err('PIN must be 4–6 digits'); if (p !== val('mmnew2')) return err('PINs do not match'); put(await setPin(p)); close(); mmLockSettings(); }; return; }
    const check = async () => (await sha(L.salt, val('mmcur'))) === L.hash;
    w.querySelector('#mmauto').onchange = e => { const c = get(); c.auto = +e.target.value; put(c); };
    const b = w.querySelector('#mmbio2');
    if (b) b.onclick = async () => {
      const c = get();
      if (c.cred) { delete c.cred; put(c); close(); mmLockSettings(); return; }
      try {
        const cr = await navigator.credentials.create({ publicKey: { challenge: rnd(32), rp: { name: 'My Money', id: location.hostname }, user: { id: rnd(16), name: 'me', displayName: 'Me' },
          pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }], authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' }, timeout: 60000 } });
        c.cred = b64(cr.rawId); put(c); close(); mmLockSettings();
      } catch (e) { err('Face ID could not be turned on on this device.'); }
    };
    w.querySelector('#mmsave').onclick = async () => {
      if (!val('mmnew')) { close(); return; }
      if (!(await check())) return err('Current PIN is wrong'); if (!okPin(val('mmnew'))) return err('New PIN must be 4–6 digits');
      const c = Object.assign(get(), await setPin(val('mmnew'))); put(c); close();
    };
    w.querySelector('#mmoff').onclick = async () => { if (!(await check())) return err('Enter your current PIN to turn off'); put(null); document.documentElement.classList.remove('mml'); close(); };
  };
})();

<body>
<div id="load"></div>
<div id="app"></div>
<button class="fab" id="fab" onclick="editTx()">+</button>
<nav id="nav"></nav>
<div id="bd" onclick="closeM()"></div>
<div id="sheet"></div>
<div id="viewer"></div>

<script>
/* Base currency LKR. Budgets, goals and totals are in LKR.
   USD accounts keep their balance in USD. Every USD transaction stores the rate used,
   and every rate update is saved as a new row in the Rates sheet (history is never overwritten). */
let D = {Categories:[],Accounts:[],Transactions:[],Goals:[],Settings:[],Rates:[],Loans:[],LoanPayments:[],AccBudgets:[],Assets:[],InvTx:[],Prices:[],BudgetLog:[],CardPay:[],CardPlans:[],Trips:[],TripMembers:[],TripPay:[],TripBudget:[],TripExp:[]};
let homeAcct = null, booted = false;     // homeAcct null = not chosen yet, use the default account
let homeOpen = null, stmtFrom = null, moreEdit = false;
let tab = 'home', M = null, homeAll = false, reorder = false, sub = null, invKind = 'Unit Trust', budAcct = null, stmtAcc = null, stmtShown = 40, showSettled = false, reopen = null;
const now = new Date();
let month = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const $ = s => document.querySelector(s);
const fmt = n => 'LKR ' + Math.round(+n || 0).toLocaleString();
const fmtC = (n, c) => c + ' ' + (+n || 0).toLocaleString(undefined, {maximumFractionDigits: c === 'USD' ? 2 : 0});
const n0 = x => Math.round(+x || 0).toLocaleString();
const n2 = x => (+x || 0).toLocaleString(undefined, {maximumFractionDigits: 2});
const short = x => { x = +x || 0; const a = Math.abs(x); return a >= 1e6 ? (x / 1e6).toFixed(1) + 'M' : a >= 1e4 ? Math.round(x / 1e3) + 'k' : n0(x); };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum = (a, f) => a.reduce((s, x) => s + (+f(x) || 0), 0);
const PAL = ['#0f766e','#c2410c','#2563eb','#a21caf','#ca8a04','#0891b2','#dc2626','#65a30d'];
const byOrder = (a, b) => (+a.Order || 1e9) - (+b.Order || 1e9);

function setData(d) {
  D = Object.assign({Settings: [], Rates: [], Loans: [], LoanPayments: [], AccBudgets: [], Assets: [], InvTx: [], Prices: [], BudgetLog: [], CardPay: [], CardPlans: [], Trips: [], TripMembers: [], TripPay: [], TripBudget: [], TripExp: []}, d);
  D.Categories.sort(byOrder); D.Accounts.sort(byOrder);
}
function call(fn, ...args) {
  $('#load').style.display = 'block';
  google.script.run
    .withSuccessHandler(d => { setData(d); const first = !booted; if (first) { booted = true; tab = tabList()[0][0]; } $('#load').style.display = 'none'; render(); if (first) setTimeout(() => dueAlert(false), 400); if (reopen) { const r = reopen; reopen = null; if (r.indexOf('asset:') === 0) showAsset(r.slice(6)); else if (r.indexOf('fd:') === 0) showFD(r.slice(3)); else if (r.indexOf('acctbud:') === 0) editAcctBudget(r.slice(8)); else showLoan(r); } })
    .withFailureHandler(e => { $('#load').style.display = 'none'; alert('Error: ' + e.message); })
    [fn](...args);
}

/* ---------- rates + calculations ---------- */
const legacyRate = () => +((D.Settings.find(s => s.ID === 'USDRate') || {}).Value) || 300;
const lastRate = () => D.Rates.slice().sort((a, b) => String(a.Date) < String(b.Date) ? -1 : String(a.Date) > String(b.Date) ? 1 : 0).pop();
const buyRate = () => +(lastRate() || {}).Buy || legacyRate();
const sellRate = () => +(lastRate() || {}).Sell || legacyRate();
const accByName = n => D.Accounts.find(a => a.Name === n);
const cur = a => (a && a.Currency) || 'LKR';
const rateOf = c => c === 'USD' ? sellRate() : 1;            // USD balances are valued at the selling rate
const lkr = t => {                                           // LKR value of a transaction
  const a = +t.Amount || 0;
  if (t.Type === 'Transfer') return cur(accByName(t.Account)) === 'USD' ? a * (+t.Rate || sellRate()) : a;
  return a * (+t.Rate || 1);
};
// money that counts against a budget: expenses, plus transfers tagged with a budget category (e.g. Saving)
const incCat = n => D.Categories.some(c => c.Type === 'Income' && c.Name === n);
const isOut = t => t.Type === 'Expense' || (t.Type === 'Transfer' && !!t.Category && !incCat(t.Category));
const isInTag = t => t.Type === 'Income' || (t.Type === 'Transfer' && !!t.Category && incCat(t.Category));   // a transfer tagged to an income category (e.g. USD→LKR salary) counts as income
const recvLkr = t => {                                       // LKR value that actually arrived in the receiving account
  const to = accByName(t.ToAccount), amt = +t.ToAmount || +t.Amount || 0;
  return cur(to) === 'USD' ? amt * (+t.Rate || sellRate()) : amt;
};
const val = t => t.Type === 'Transfer' && isInTag(t) ? recvLkr(t) : lkr(t);
const inType = (t, type) => type === 'Expense' ? isOut(t) : isInTag(t);

/* ---------- budget history: a change applies from its month onward, earlier months keep the old figure ---------- */
const thisYm = () => { const n = new Date(); return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0'); };
const budgetAt = (kind, cat, acct, ym) => {
  let v = null;
  (D.BudgetLog || []).filter(r => r.Kind === kind && r.Category === cat && String(r.Account || '') === String(acct || ''))
    .sort((a, b) => String(a.From).slice(0, 7) < String(b.From).slice(0, 7) ? -1 : 1)
    .forEach(r => { if (String(r.From).slice(0, 7) <= ym) v = +r.Amount || 0; });
  return v;
};
const catBud = (c, ym) => { const v = budgetAt('cat', c.Name, '', ym); return v === null ? (+c.Budget || 0) : v; };
const accBud = (cat, acct, ym) => { const v = budgetAt('acc', cat, acct, ym); if (v !== null) return v; const r = D.AccBudgets.find(x => x.Category === cat && x.Account === acct); return r ? +r.Amount || 0 : 0; };
const acctFull = n => { const a = accByName(n); return a ? accLabel(a) : n; };
const mTx = () => D.Transactions.filter(t => String(t.Date).slice(0, 7) === month)
  .sort((a, b) => a.Date < b.Date ? 1 : -1);
const catSpent = (name, type) => sum(mTx().filter(t => inType(t, type) && t.Category === name), val);
const monthTot = (ym, type) => sum(D.Transactions.filter(t => inType(t, type) && String(t.Date).slice(0, 7) === ym), val);

function entries(a) {          // every movement on this account: transactions, loans, repayments, investments
  const e = []; let s = 0;
  D.Transactions.forEach(t => {
    const x = +t.Amount || 0;
    if (t.Account === a.Name) e.push({d: t.Date, s: s++, amt: t.Type === 'Income' ? x : -x, k: 'tx', r: t});
    if (t.Type === 'Transfer' && t.ToAccount === a.Name) e.push({d: t.Date, s: s++, amt: +t.ToAmount || x, k: 'txin', r: t});
  });
  D.Loans.forEach(l => { if (l.Account === a.Name) e.push({d: l.Date, s: s++, amt: (l.Direction === 'Borrowed' ? 1 : -1) * (+l.Amount || 0), k: 'loan', r: l}); });
  D.LoanPayments.forEach(p => {
    const l = loanById(p.LoanID);
    if (l && p.Account === a.Name) e.push({d: p.Date, s: s++, amt: (l.Direction === 'Lent' ? 1 : -1) * (+p.Amount || 0), k: 'pay', r: p, l});
  });
  D.InvTx.forEach(t => { if (t.Account === a.Name) e.push({d: t.Date, s: s++, amt: (t.Type === 'Buy' ? -1 : 1) * (+t.Amount || 0), k: 'inv', r: t}); });
  D.CardPay.forEach(p => { if (p.Card === a.Name) e.push({d: p.Date, s: s++, amt: +p.Amount || 0, k: 'cardpay', r: p}); });
  D.TripPay.forEach(p => { if (p.Account === a.Name) e.push({d: p.Date, s: s++, amt: (p.Kind === 'Refund' ? -1 : 1) * (+p.Amount || 0), k: 'trippay', r: p}); });
  D.TripExp.forEach(x => { if (x.Account === a.Name && x.Status !== 'Agreed') e.push({d: x.Date, s: s++, amt: -(+x.Amount || 0), k: 'tripexp', r: x}); });
  return e;
}
const own = a => (+a.Opening || 0) + sum(entries(a), x => x.amt);   // balance in the account's own currency
const kids = a => D.Accounts.filter(c => c.Parent === a.Name);
const leafList = () => { const out = []; const walk = a => { const k = kids(a); if (!k.length) out.push(a); else k.forEach(walk); }; roots().forEach(walk); return out; };   // real accounts, not bank groups
const getSet = id => (D.Settings.find(s => s.ID === id) || {}).Value;
const setSet = (id, value) => {            // saved in the Settings sheet, applied immediately
  const r = D.Settings.find(s => s.ID === id);
  if (r) r.Value = value; else D.Settings.push({ID: id, Value: value});
  google.script.run.withFailureHandler(e => alert('Could not save: ' + e.message)).save('Settings', {ID: id, Value: value});
};
// Home dropdown: only Savings accounts (falls back to all real accounts if none is typed 'Savings')
const homeList = () => {                                   // Savings accounts in the order chosen with drag (HomeOrder)
  let s = leafList().filter(a => a.Type === 'Savings'); if (!s.length) s = leafList();
  const ord = String(getSet('HomeOrder') || '').split(',');
  return s.slice().sort((a, b) => { const x = ord.indexOf(a.ID), y = ord.indexOf(b.ID); return (x < 0 ? 999 : x) - (y < 0 ? 999 : y); });
};
const defAcct = () => { const n = getSet('HomeAccount'); return n && homeList().some(a => a.Name === n) ? n : ''; };
const groupNames = a => { const s = new Set([a.Name]); const walk = x => kids(x).forEach(k => { s.add(k.Name); walk(k); }); walk(a); return s; };
const totalLkr = a => own(a) * rateOf(cur(a)) + sum(kids(a), totalLkr);
const total = a => totalLkr(a) / rateOf(cur(a));
const num = x => Math.abs(+x) >= 1e6 ? short(x) : n0(x);
const accLabel = a => a.Parent ? a.Parent + ' › ' + a.Name : a.Name;
const loanById = id => D.Loans.find(l => l.ID === id);
const paid = l => sum(D.LoanPayments.filter(p => p.LoanID === l.ID), p => p.Amount);
const outstanding = l => (+l.Amount || 0) - paid(l);
const lkrAccs = () => D.Accounts.filter(a => cur(a) === 'LKR').map(a => a.Name);
const roots = () => D.Accounts.filter(a => !a.Parent || !D.Accounts.some(p => p.Name === a.Parent));

/* ---------- navigation ---------- */
const TABS = [['home','🏠','Home'],['ov','✨','Overview'],['tx','🧾','Transactions'],['ana','📊','Analysis'],['budget','🎯','Budget'],['acc','🏦','Accounts'],['more','☰','More']];
const allTabs = () => {                                    // every tab, in the saved order
  const known = TABS.map(t => t[0]);
  const saved = Array.from(new Set(String(getSet('TabOrder') || '').split(',').filter(k => known.indexOf(k) >= 0)));
  known.forEach(k => { if (saved.indexOf(k) < 0) saved.push(k); });
  return saved.map(k => TABS.find(t => t[0] === k));
};
const hiddenSet = () => new Set(String(getSet('HiddenTabs') || '').split(',').filter(k => k && k !== 'more'));
const tabList = () => allTabs().filter(t => !hiddenSet().has(t[0]));      // tabs shown in the bottom bar
function toggleTab(k) {
  if (k === 'more') return;
  const h = hiddenSet(); if (h.has(k)) h.delete(k); else h.add(k);
  setSet('HiddenTabs', Array.from(h).join(',')); render();
}
const animMode = () => getSet('Anim') || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches ? 'off' : 'subtle');
let lastKey = '', lastAKey = '';
function render() {
  const key = tab + '|' + (sub || '') + '|' + (stmtAcc || ''), akey = tab + '|' + (homeAcct || '') + '|' + (budAcct || '');
  const enter = key !== lastKey, swap = !enter && akey !== lastAKey; lastKey = key; lastAKey = akey;
  document.body.dataset.anim = animMode();
  $('#nav').innerHTML = tabList().map(t => `<button class="${tab===t[0] || (t[0]==='more' && hiddenSet().has(tab)) ? 'on':''}" onclick="go('${t[0]}')"><span>${t[1]}${t[0] === 'ov' && dueItems().length ? `<em class="bdg">${dueItems().length}</em>` : ''}</span>${t[2]}</button>`).join('');
  $('#fab').style.display = (tab === 'home' || tab === 'tx') ? 'block' : 'none';
  $('#app').innerHTML = ({home, ov, tx, ana, budget, acc, more})[tab]();
  const a = $('#app'); a.classList.remove('in', 'inl', 'inr');
  if (enter && animMode() !== 'off') { void a.offsetWidth; a.classList.add(slideDir > 0 ? 'inr' : slideDir < 0 ? 'inl' : 'in'); }
  if (swap && animMode() !== 'off') { const dir = slideDir < 0 ? 'l' : 'r'; Array.from(a.children).forEach(el => el.classList.add(el.matches('.swipe-acct, .swipe-bud') ? 'cs-' + dir : 'mm-fadein')); }
  slideDir = 0;
  document.querySelectorAll('#app .qchips').forEach(c => { const on = c.querySelector('.qc.on'); if (on && (on.offsetLeft < c.scrollLeft || on.offsetLeft + on.offsetWidth > c.scrollLeft + c.clientWidth)) c.scrollLeft = Math.max(0, on.offsetLeft - c.clientWidth / 2 + on.offsetWidth / 2); });   // only if the chosen account is out of view
}
function go(t) { tab = t; reorder = false; sub = null; stmtAcc = null; stmtFrom = null; moreEdit = false; render(); window.scrollTo(0, 0); }
function shift(d) {
  const [y, m] = month.split('-').map(Number);
  const dt = new Date(y, m - 1 + d, 1);
  month = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0');
  render();
}
const monthBar = () => {
  const [y, m] = month.split('-').map(Number);
  const name = new Date(y, m - 1, 1).toLocaleString(undefined, {month:'long', year:'numeric'});
  return `<div class="month"><button onclick="shift(-1)">‹</button><b>${name}</b><button onclick="shift(1)">›</button></div>`;
};
const spendColor = p => p >= 100 ? 'var(--warn)' : p >= 80 ? '#ea580c' : p >= 60 ? '#ca8a04' : '#16a34a';   // green -> yellow -> orange -> red
const progress = (spent, budget, cls, spend) => {              // spend = true: colour changes as the budget is used up
  const p = budget > 0 ? spent / budget * 100 : 0;
  return `<div class="bar ${cls || ''}"><i class="${p>100?'over':''}" style="width:${Math.max(0,Math.min(p,100))}%${spend ? ';background:' + spendColor(p) : ''}"></i></div>`;
};
const mvBtns = (sheet, list, x, i) => `<span class="mv"><button ${i===0?'disabled':''} onclick="move('${sheet}','${x.ID}',-1)">▲</button><button ${i===list.length-1?'disabled':''} onclick="move('${sheet}','${x.ID}',1)">▼</button></span>`;

/* ---------- reorder ---------- */
function move(sheet, id, dir) {
  const list = sheet === 'Categories' ? D.Categories : D.Accounts;
  const it = list.find(x => x.ID === id);
  const group = list.filter(x => sheet === 'Categories' ? x.Type === it.Type : (x.Parent || '') === (it.Parent || ''));
  const i = group.indexOf(it), j = i + dir;
  if (j < 0 || j >= group.length) return;
  group.splice(i, 1); group.splice(j, 0, it);
  group.forEach((x, k) => x.Order = k + 1);
  list.sort(byOrder);
  render();
  google.script.run.withFailureHandler(e => alert('Could not save order: ' + e.message)).reorder(sheet, group.map(x => x.ID));
}

/* ---------- views ---------- */
let HOME_OPTS = [];
function pickAcct() {
  M = null; HOME_OPTS = [''].concat(homeList().map(x => x.Name));

function monthsBack(n) {

function barChart(ms) {

  const hh = v => (H - pb - pt) * v / max;

    g += `<rect class="s-inc" x="${x}" y="${H - pb - hh(inc[i])}" width="${bw}" height="${hh(inc[i])}" rx="3"/>` +
         `<rect class="s-exp" x="${x + bw + 1}" y="${H - pb - hh(exp[i])}" width="${bw}" height="${hh(exp[i])}" rx="3"/>` +
         `<text x="${x + bw}" y="${H - 4}" text-anchor="middle" font-size="10" ${m === month ? 'style="font-weight:700;fill:var(--ink)"' : ''}>${lab}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>
    <div class="legend"><span><i class="dot" style="background:var(--inc)"></i>Income</span><span><i class="dot" style="background:var(--exp)"></i>Expenses</span></div>`;
}
function donut(items, tot) {
  const r = 42, C = 2 * Math.PI * r; let off = 0;
  const segs = items.map((it, i) => {
    const len = C * it.v / tot;
    const s = `<circle cx="60" cy="60" r="${r}" fill="none" stroke="${PAL[i % PAL.length]}" stroke-width="18" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;
    off += len; return s;
  }).join('');
  const svg = `<svg viewBox="0 0 120 120" width="125" height="125">${segs}
    <text x="60" y="57" text-anchor="middle" font-size="9">Spent</text>
    <text x="60" y="71" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--ink)">${short(tot)}</text></svg>`;
  const lg = items.map((it, i) => `<div><span><i class="dot" style="background:${PAL[i % PAL.length]}"></i>${esc(it.n)}</span><span>${(it.v / tot * 100).toFixed(0)}%</span></div>`).join('');
  return `<div class="donut">${svg}<div class="lg">${lg}</div></div>`;
}
function lineChart(rows) {
  const W = 340, H = 110, px = 8, py = 10;
  const vals = rows.flatMap(r => [+r.Buy, +r.Sell]);
  let lo = Math.min(...vals), hi = Math.max(...vals); if (hi === lo) { hi += 1; lo -= 1; }
  const x = i => px + (W - 2 * px) * i / (rows.length - 1), y = v => H - py - (H - 2 * py) * (v - lo) / (hi - lo);
  const pts = k => rows.map((r, i) => x(i).toFixed(1) + ',' + y(+r[k]).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H + 14}" width="100%">

    <text x="${px}" y="${H + 11}" font-size="10">${esc(rows[0].Date)}</text>

    || '<div class="mute">None yet</div>';

  <div class="mute" style="margin:0 0 10px">${reorder ? 'Drag ⠿ to change the order. It is used everywhere in the app.' : 'Monthly budget in LKR. A change applies from the month shown, onward; earlier months keep their old budget.'}</div>

}

function accNode(a, depth) {

  }

function closeStmt() { stmtAcc = null; if (stmtFrom) tab = stmtFrom; stmtFrom = null; render(); window.scrollTo(0, 0); }

  if (e.k === 'pay') return {title: (e.l.Direction === 'Lent' ? 'Received from ' : 'Repaid to ') + e.l.Person, sub: r.Note || '', go: `showLoan('${e.l.ID}')`};
  const as = D.Assets.find(x => x.ID === r.AssetID);
  return {title: (r.Type === 'Buy' ? 'Bought ' : r.Type === 'Sell' ? 'Sold ' : 'Dividend · ') + (as ? as.Name : 'investment'), sub: r.Note || '', go: as ? `showAsset('${as.ID}')` : ''};
}
let stmtK = 0, stmtAll = false;
const isoD = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

  const t = new Date(), sd = Math.round(+a.StmtDay) || 0;
  if (a.Type === 'Card' && sd >= 1 && sd <= 31) {
    const endM = t.getMonth() + (t.getDate() > sd ? 1 : 0) + k, end = dueIn(t.getFullYear(), endM, sd), pe = dueIn(t.getFullYear(), endM - 1, sd);
    const start = new Date(pe.getFullYear(), pe.getMonth(), pe.getDate() + 1);
    return {start, end, label: shortDate(start) + ' – ' + shortDate(end), cycle: true};
  }
  const start = new Date(t.getFullYear(), t.getMonth() + k, 1), end = new Date(t.getFullYear(), t.getMonth() + k + 1, 0);
  return {start, end, label: start.toLocaleString(undefined, {month: 'long', year: 'numeric'}), cycle: false};
}
function switchStmt(id) { stmtAcc = id; stmtK = 0; stmtAll = false; stmtShown = 40; render(); window.scrollTo(0, 0); }

  const v = id ? D.CardPlans.find(p => p.ID === id) : {Card: cardName, Start: today(), Months: 12, Closed: 'Open'};
  openForm(id ? 'Edit installment plan' : 'New installment plan', 'CardPlans', [
    {k:'Item', l:'Purchase (e.g. Samsung TV)', req:true},
    {k:'Total', l:'Total to pay in installments (LKR, include any interest)', t:'number', req:true},
    {k:'Months', l:'Number of monthly installments', t:'number', req:true},
    {k:'Start', l:'First installment date', t:'date', req:true},
    {k:'Note', l:'Note'},

function statement() {
  const a = D.Accounts.find(x => x.ID === stmtAcc);
  if (!a) { stmtAcc = null; return acc(); }
  const c = cur(a), f = x => c === 'USD' ? fmtC(x, c) : n0(x), card = a.Type === 'Card';
  const es = entries(a).sort((x, y) => String(x.d) < String(y.d) ? -1 : String(x.d) > String(y.d) ? 1 : x.s - y.s);
  let bal = +a.Opening || 0;
  const all = es.map(e => { bal += e.amt; return Object.assign({}, e, {bal}); }), endBal = bal;
  let rows, opening, closing, rng = null;
  if (stmtAll) { rows = all.slice().reverse(); opening = +a.Opening || 0; closing = endBal; }
  else {
    rng = stmtRange(a, stmtK);
    const s0 = isoD(rng.start), e0 = isoD(rng.end), dd = e => String(e.d).slice(0, 10);
    const before = all.filter(e => dd(e) < s0), inside = all.filter(e => dd(e) >= s0 && dd(e) <= e0);
    opening = before.length ? before[before.length - 1].bal : (+a.Opening || 0);
    closing = inside.length ? inside[inside.length - 1].bal : opening;
    rows = inside.slice().reverse();

  const shown = stmtAll ? rows.slice(0, stmtShown) : rows, allShown = stmtAll ? rows.length <= stmtShown : true;

    return `<div class="srow" style="padding:7px 0;align-items:baseline" ${d.go ? `onclick="${d.go}"` : ''}><div style="min-width:0"><span class="mute">${esc(String(e.d).slice(5))}</span> ${esc(d.title)}${d.sub ? ` <span class="mute" style="font-size:12px">· ${esc(d.sub)}</span>` : ''}</div>
      <b class="${e.amt < 0 ? 'exp' : 'inc'}" style="white-space:nowrap;font-weight:500">${e.amt < 0 ? '−' : '+'} ${f(Math.abs(e.amt))}</b></div>`; };
  const chips = `<div class="qchips" style="margin:0 0 8px">${leafList().map(x => `<button class="qc ${x.ID === a.ID ? 'on' : ''}" onclick="switchStmt('${x.ID}')">${x.Type === 'Card' ? '💳 ' : ''}${esc(x.Name)}</button>`).join('')}</div>`;
  const owed = Math.max(0, -endBal), lim = +a.Limit || 0, due = card ? cardDue(a) : null;
  const head = `<div class="card tight"><div class="row"><div><b style="font-size:17px">${esc(a.Name)}</b> <span class="mute">${c}${a.Type ? ' · ' + esc(a.Type) : ''}</span></div><span class="lnk" onclick="editAcc('${a.ID}')">Edit</span></div>
    <div class="mute" style="margin-top:4px">${card ? 'Amount owed' : 'Ending balance'}</div>
    <div class="big ${card ? (owed > 0 ? 'warn' : '') : (endBal < 0 ? 'warn' : '')}" style="font-size:26px">${card ? f(owed > 0 ? owed : endBal) : f(endBal)}</div>
    ${c === 'USD' ? `<div class="mute">≈ ${fmt(endBal * rateOf(c))}</div>` : ''}
    ${card && lim ? `${progress(owed, lim, 'thin', true)}<div class="row mute" style="font-size:12px;margin-top:4px"><span>Available ${f(lim - owed)}</span><span>Limit ${f(lim)}</span></div>` : ''}
    ${card && due && owed > 0 ? `<div class="mute" style="margin-top:6px">Pay by ${shortDate(due)} · ${when(daysTo(due))}</div>` : ''}

  const bar = `<div class="row" style="margin:6px 0 8px;align-items:center">
    ${stmtAll ? '<b>All time</b>' : `<div class="row" style="gap:10px;align-items:center"><button class="qc" onclick="stmtK--;render()">‹</button><b>${esc(rng.label)}</b><button class="qc" ${stmtK >= 0 ? 'disabled style="opacity:.4"' : ''} onclick="stmtK++;render()">›</button></div>`}
    <span class="lnk" style="margin:0" onclick="stmtAll=!stmtAll;stmtK=0;render()">${stmtAll ? 'By period' : 'All time'}</span></div>`;
  const kpi = `<div class="card tight"><div class="kpi"><div><span>Opening</span><b>${f(opening)}</b></div><div><span>${card ? 'Purchases' : 'Money out'}</span><b class="exp">${f(out)}</b></div>
    <div><span>${card ? 'Payments' : 'Money in'}</span><b class="inc">${f(inn)}</b></div><div><span>${card ? 'Statement balance' : 'Closing'}</span><b class="${(card ? closing : closing) < 0 ? 'warn' : ''}">${card ? f(Math.max(0, -closing)) : f(closing)}</b></div></div></div>`;
  let plansHtml = '';
  if (card) {
    const plans = D.CardPlans.filter(p => p.Card === a.Name), op = plans.filter(p => p.Closed !== 'Closed'), cl = plans.filter(p => p.Closed === 'Closed');
    const pc = p => { const q = planCalc(p);
      return `<div class="card tight" onclick="editPlan('${p.ID}')"><div class="row"><b>${esc(p.Item)}</b><b>${fmt(q.remain)}</b></div>
        <div class="row mute"><span>${fmt(q.per)} × ${q.n} months · ${q.done} of ${q.n} paid</span><span>${q.left} left</span></div>${progress(q.done, q.n, 'thin')}
        <div class="mute" style="font-size:12px;margin-top:4px">${q.next ? 'Next ' + shortDate(q.next) : 'Completed'}${q.end ? ' · ends ' + q.end.toLocaleString(undefined, {month: 'short', year: 'numeric'}) : ''}</div></div>`; };
    plansHtml = `<h2>Installment plans</h2>

      ${cl.length ? `<div class="mute" style="font-size:12px;margin:8px 0 4px">Closed</div>${cl.map(p => `<div class="card tight" style="opacity:.65" onclick="editPlan('${p.ID}')"><div class="row"><b>${esc(p.Item)}</b><span class="mute">${fmt(p.Total)}</span></div></div>`).join('')}` : ''}
      <button class="btn ghost" onclick="editPlan(null,'${esc(a.Name).replace(/'/g, "\\'")}')">＋ Installment plan</button>`;
  }
  return `<div class="back" onclick="closeStmt()">‹ ${stmtFrom === 'ov' ? 'Overview' : stmtFrom === 'home' ? 'Home' : 'Accounts'}</div>${chips}${head}${bar}${kpi}
  <div class="card tight">${shown.map(row).join('') || '<div class="mute" style="padding:6px 0">No movements in this period.</div>'}
    ${stmtAll && allShown ? `<div class="srow"><div><b>Opening balance</b></div><div class="right"><b>${f(+a.Opening || 0)}</b></div></div>` : ''}
    ${stmtAll && !allShown ? `<div class="more" onclick="stmtShown+=40;render()">Show earlier (${rows.length - stmtShown} more)</div>` : ''}</div>${plansHtml}`;

const payDay = a => { const d = Math.round(+a.PayDay); return d >= 1 && d <= 31 ? d : 0; };
const cardDue = a => { const d = payDay(a); if (!d) return null; const t = new Date(); let dt = dueIn(t.getFullYear(), t.getMonth(), d); if (midnight(dt) < midnight(t)) dt = dueIn(t.getFullYear(), t.getMonth() + 1, d); return dt; };

  return {tot, n, per, done, left: n - done, remain: Math.max(0, tot - per * done), end: st ? addMonths(st, n - 1) : null, next: st && done < n ? addMonths(st, done) : null};

      <div class="ac-b"><b class="${owed > 0 ? 'warn' : 'inc'}">${owed > 0 ? '−' + num(owed) : num(o)}</b><small>${owed > 0 ? 'owed' : 'credit'}</small></div></div>
    ${lim ? `<div>${progress(owed, lim, 'thin', true)}<div class="row mute" style="font-size:12px;margin:4px 0 8px"><span>Available ${num(lim - owed)}</span><span>Limit ${num(lim)}</span></div></div>` : ''}

const accIc = a => ({Cash: '💵', Bank: '🏦', Card: '💳', Savings: '🐷', Investment: '📈', Other: '🧾'}[a.Type] || '🏦');
const accTint = a => ({Cash: '#16a34a', Bank: '#2563eb', Card: '#c026d3', Savings: '#0d9488', Investment: '#4f46e5', Other: '#6b7280'}[a.Type] || '#2563eb');

function acc() {

const bannerLine = () => { const n = dueItems().length; return n ? `⏰ ${n} item${n > 1 ? 's need' : ' needs'} your attention` : 'Nice to see you again! Nothing is due soon ✨'; };

const dueDaysSet = () => Math.max(0, +getSet('DueDays') || 3);

function dueItems() {                                      // overdue and coming up within N days, most urgent first
  const N = dueDaysSet(), out = [];
  cardDues().filter(x => x.days <= N).forEach(x => out.push({k: 'Credit card', title: x.a.Name, sub: 'Payment due', amt: x.owed, days: x.days, go: `openStmt('${x.a.ID}')`}));
  billsDue().filter(x => !x.done && x.days <= N).forEach(x => out.push({k: 'Bill', title: x.c.Name, sub: acctFull(x.acct), amt: x.paid > 0 ? x.left : x.b, days: x.days, go: "go('ov')"}));
  D.Loans.forEach(l => { const n = loanNext(l); if (n && daysTo(n.date) <= N) out.push({k: l.Direction === 'Lent' ? 'To receive' : 'To pay', title: l.Person, sub: n.inst ? 'Installment' : 'Loan due', amt: n.amt, days: daysTo(n.date), go: `openLoan('${l.ID}')`}); });
  fds().filter(f => f.Closed !== 'Closed').forEach(f => { const c = fdCalc(f); if (c.mat && !c.matured && c.daysLeft <= N) out.push({k: 'Deposit', title: f.Name, sub: 'Fixed deposit matures', amt: c.P + (f.Payout && f.Payout !== 'At maturity' ? 0 : c.total), days: c.daysLeft, go: `openFD('${f.ID}')`}); });
  return out.sort((a, b) => a.days - b.days);
}
function closeDue() { const e = document.getElementById('duepop'); if (e) e.remove(); }

function billsDue() {                                      // account budgets that have a due day
  const n = new Date(), ym = n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0');
  return D.AccBudgets.filter(x => dueDay(x) && D.Categories.some(c => c.Type === 'Expense' && c.Name === x.Category)).map(x => {
    const b = accBud(x.Category, x.Account, thisYm());
    const paid = sum(D.Transactions.filter(t => isOut(t) && t.Category === x.Category && t.Account === x.Account && String(t.Date).slice(0, 7) === ym), val);
    const done = b > 0 ? paid >= b - 0.5 : paid > 0;
    const due = dueIn(n.getFullYear(), n.getMonth(), dueDay(x));
    const next = dueIn(n.getFullYear(), n.getMonth() + 1, dueDay(x));
    return {c: {Name: x.Category, DueDay: x.DueDay}, acct: x.Account, b, paid, done, due, next, days: daysTo(due), left: Math.max(b - paid, 0)};

const loanNext = l => {                                     // next installment (or the due date when there are none)

};

};

/* ----- investments: unit trusts and shares (average-cost method) ----- */
const byDateAsc = (a, b) => String(a.Date) < String(b.Date) ? -1 : String(a.Date) > String(b.Date) ? 1 : 0;
const fmtU = x => (+x || 0).toLocaleString(undefined, {maximumFractionDigits: 4});
const fmtP = x => (+x || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 4});
const sgn = x => (x > 0.005 ? '+' : x < -0.005 ? '−' : '') + n0(Math.abs(x));
const round2 = x => Math.round((+x || 0) * 100) / 100;
function pricePts(a) {            // buy/sell prices and manual price updates, oldest first (updates win same-day ties)
  return D.InvTx.filter(t => t.AssetID === a.ID && (t.Type === 'Buy' || t.Type === 'Sell') && +t.Price > 0)
    .map(t => ({Date: t.Date, Price: +t.Price}))
    .concat(D.Prices.filter(p => p.AssetID === a.ID).map(p => ({Date: p.Date, Price: +p.Price})))
    .sort(byDateAsc);
}
function calc(a, excludeId) {
  const txs = D.InvTx.filter(t => t.AssetID === a.ID && t.ID !== excludeId).sort(byDateAsc);
  let units = 0, cost = 0, realized = 0, div = 0, fees = 0;
  txs.forEach(t => {
    const u = +t.Units || 0, p = +t.Price || 0, f = +t.Fees || 0;
    if (t.Type === 'Buy') { cost += u * p + f; units += u; fees += f; }
    else if (t.Type === 'Sell') {
      const sold = Math.min(u, units), avg = units > 0 ? cost / units : 0;
      realized += (u * p - f) - avg * sold; cost -= avg * sold; units -= sold; fees += f;
      if (units < 1e-8) { units = 0; cost = 0; }
    } else if (t.Type === 'Dividend') div += +t.Amount || 0;
  });
  const pts = pricePts(a), last = pts[pts.length - 1];
  const price = last ? last.Price : 0, value = units * price;
  return {units, cost, avg: units > 0 ? cost / units : 0, price, priceDate: last ? last.Date : '', value,
    unreal: value - cost, pct: cost > 0 ? (value - cost) / cost * 100 : 0, realized, div, fees};
}
const pl = x => x < -0.005 ? 'warn' : x > 0.005 ? 'inc' : '';
function spark(pts) {
  pts = pts.slice(-40);
  const W = 340, H = 70, px = 6, py = 8, v = pts.map(p => p.Price);
  let lo = Math.min(...v), hi = Math.max(...v); if (hi === lo) { hi += 1; lo -= 1; }
  const x = i => px + (W - 2 * px) * i / (pts.length - 1), y = val => H - py - (H - 2 * py) * (val - lo) / (hi - lo);
  return `<svg viewBox="0 0 ${W} ${H + 12}" width="100%"><polyline points="${pts.map((p, i) => x(i).toFixed(1) + ',' + y(p.Price).toFixed(1)).join(' ')}" fill="none" stroke="var(--acc)" stroke-width="2"/>
    <text x="${px}" y="${H + 10}" font-size="10">${esc(pts[0].Date)}</text><text x="${W - px}" y="${H + 10}" text-anchor="end" font-size="10">${esc(pts[pts.length - 1].Date)}</text></svg>`;
}

/* ----- fixed deposits ----- */
const fds = () => D.FDs || [];
const addMonths = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth() + n, 1); x.setDate(Math.min(d.getDate(), new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate())); return x; };
const monthsDone = (s, end) => { let m = 0; while (addMonths(s, m + 1) <= end) m++; return m; };
function fdCalc(f) {                                       // simple interest, actual days / 365
  const P = +f.Principal || 0, r = (+f.Rate || 0) / 100, s = parseD(f.StartDate);
  if (!s) return {P, earned: 0, total: 0, paid: 0, value: P, mat: null, daysLeft: null, matured: false, perMonth: P * r / 12};
  const term = +f.TermMonths || 0, mat = term ? addMonths(s, term) : null, t0 = midnight(new Date());
  const end = mat && t0 > mat ? mat : t0, days = Math.max(0, Math.round((end - s) / 864e5));
  const earned = P * r * days / 365, total = mat ? P * r * Math.round((mat - s) / 864e5) / 365 : 0;
  const mdone = monthsDone(s, end);
  const paid = f.Payout === 'Monthly' ? P * r / 12 * mdone : f.Payout === 'Annually' ? P * r * Math.floor(mdone / 12) : 0;
  return {P, earned, total, paid, value: P + Math.max(0, earned - paid), mat, daysLeft: mat ? Math.round((mat - t0) / 864e5) : null, matured: !!mat && t0 >= mat, perMonth: P * r / 12};
}
function invFD() {
  const open = fds().filter(f => f.Closed !== 'Closed'), closed = fds().filter(f => f.Closed === 'Closed');

  return `<div class="back" onclick="sub=null;render()">‹ More</div><h1>Investments</h1>${invSeg()}

function inv() {

function calcEval(str) {                                   // "500+200+30" -> 730 (only + - × ÷ ( ) and digits are allowed)
  const t = String(str == null ? '' : str).replace(/[×x*]/g, '*').replace(/÷/g, '/').replace(/[−–]/g, '-').replace(/,/g, '').replace(/\s+/g, '');
  if (!t) return 0;
  if (!/^[0-9+\-*/.()]+$/.test(t)) return NaN;
  try { const r = Function('"use strict";return (' + t + ')')(); return isFinite(r) ? Math.round(r * 100) / 100 : NaN; } catch (e) { return NaN; }
}
const calcVal = sel => { const r = calcEval($(sel).value); return isNaN(r) ? 0 : r; };
function calcShow(id) {

    const ym = ($('#f_Date').value || today()).slice(0, 7), exp = c.Type === 'Expense';
    const spent = sum(D.Transactions.filter(t => t.ID !== id && String(t.Date).slice(0, 7) === ym && t.Category === name && (exp ? isOut(t) : isInTag(t)) && (!ab || t.Account === acct || (!exp && t.ToAccount === acct))), val);
    let amt = calcVal('#f_Amount'); if (cur(accByName(acct)) === 'USD') amt *= (+$('#f_Rate').value || sellRate());
    const after = spent + amt, pct = after / budget * 100, left = budget - after;
    const col = !exp ? 'var(--acc)' : spendColor(pct);
    selC.style.borderColor = col;
    box.innerHTML = `<div class="bh-bar"><i style="width:${Math.min(pct, 100).toFixed(0)}%;background:${col}"></i></div>
      <div class="bh-t" style="color:${col}">${exp ? (pct >= 100 ? (left < -0.5 ? 'Over budget by ' + fmt(-left) : 'Budget reached') : 'Left ' + fmt(left) + ' of ' + fmt(budget)) : 'Received ' + fmt(after) + ' of ' + fmt(budget)}
      <span style="font-weight:400;opacity:.85"> · ${exp ? 'spent' : 'got'} ${fmt(spent)}${amt ? ' + ' + fmt(amt) : ''}</span></div>${ln}`;
  };
  openForm(id ? 'Edit transaction' : 'New transaction', 'Transactions', [
    {k:'Type', l:'Type', t:'select', o:['Expense','Income','Transfer']},
    {k:'Account', l:'Account', t:'select', o:accs},
    {k:'Category', l:'Category', t:'select', o:[]},
    {k:'Amount', l:'Amount', t:'calc', req:true},
    {k:'ToAccount', l:'To account', t:'select', o:accs},
    {k:'Rate', l:'Rate', t:'number'},
    {k:'ToAmount', l:'Amount received', t:'number'},
    {k:'Date', l:'Date', t:'date', req:true},
    {k:'Note', l:'Note'}
  ], v, {
    extra: PHOTO_HTML,
    rateAuto: !id || !v.Rate,
    prep: o => { if (!o.ID) o.ID = rid(); },
    submit: o => call('saveTransaction', o, txLinks(o)),
    onChange: first => {
      const ty = $('#f_Type').value, sel = $('#f_Category');
      const [c, c2] = curs();
      const cross = ty === 'Transfer' && c !== c2;
      const needRate = ty === 'Transfer' ? cross : c === 'USD';
      const typeChanged = !first && ty !== M.prevType; M.prevType = ty;
      if (sel.value === '__all') M.showAll = true;
      const keep = first ? v.Category : (sel.value === '__all' ? '' : (typeChanged && !id ? '' : sel.value));
      const opt = x => `<option ${x.Name === keep ? 'selected' : ''}>${esc(x.Name)}</option>`;
      // only the categories that belong to the chosen account's budget (all of them if it has none yet)
      const union = new Set();
      [$('#f_Account').value].concat(ty === 'Transfer' ? [$('#f_ToAccount').value] : []).forEach(a => D.AccBudgets.forEach(x => { if (x.Account === a) union.add(x.Category); }));
      const restricted = !M.showAll && union.size > 0;
      const cats = t => D.Categories.filter(x => x.Type === t && (!restricted || union.has(x.Name) || x.Name === (first ? v.Category : keep)));
      sel.innerHTML = (ty === 'Transfer'
        ? '<option value="">(none)</option><optgroup label="Expense">' + cats('Expense').map(opt).join('') +
          '</optgroup><optgroup label="Income">' + cats('Income').map(opt).join('') + '</optgroup>'
        : cats(ty).map(opt).join('')) + (restricted ? '<option value="__all">Show all categories…</option>' : '');
      show('Category', true);
      renderCatChips();
      updHint();
      label('Account', ty === 'Transfer' ? 'From account' : 'Account');
      label('Category', ty === 'Transfer' ? 'Budget category (optional, e.g. Saving)' : 'Category');
      show('ToAccount', ty === 'Transfer');
      show('Rate', needRate);
      show('ToAmount', cross);
      label('Amount', 'Amount (' + c + ')');
      label('ToAmount', 'Amount received (' + c2 + ')');
      label('Rate', (ty === 'Income' ? 'Buying rate' : 'Selling rate') + ' (1 USD = LKR)');
      if (needRate && (M.rateAuto || !$('#f_Rate').value)) $('#f_Rate').value = ty === 'Income' ? buyRate() : sellRate();
      if (cross && (!first || !$('#f_ToAmount').value)) recalcTo();
    },
    validate: o => {
      if (!o.Account) return 'Add an account first';
      const c = cur(accByName(o.Account));
      if (o.Type === 'Transfer') {
        if (o.ToAccount === o.Account) return 'Choose a different destination account';
        if (c !== cur(accByName(o.ToAccount)) && (!o.ToAmount || !o.Rate)) return 'Enter the rate and the amount received';
      } else {
        if (!o.Category) return 'Choose a category';
        if (c === 'USD' && !o.Rate) return 'Enter the ' + (o.Type === 'Income' ? 'buying' : 'selling') + ' rate';
      }
      return '';
    }
  });
  $('#f_Category').onchange = () => M.opts.onChange(false);
  document.querySelector('[data-k=Category]').insertAdjacentHTML('afterend', '<div id="bhint" class="bhint" style="display:none"></div>');
  document.querySelector('[data-k=Category]').insertAdjacentHTML('afterend', '<div id="catchips" class="catchips"></div>');
  $('#f_Category').style.display = 'none'; renderCatChips(); updHint();
  document.querySelector('[data-k=Note]').insertAdjacentHTML('afterend', '<div id="nsug" class="nsug"></div>');
  $('#f_Note').addEventListener('input', showNoteSug); $('#f_Note').addEventListener('focus', showNoteSug);
  $('#f_Note').addEventListener('blur', () => setTimeout(() => { const b = $('#nsug'); if (b) b.innerHTML = ''; }, 200));
  $('#f_Note').setAttribute('autocomplete', 'off');
  $('#f_Amount').addEventListener('input', updHint); $('#f_Date').addEventListener('change', updHint); $('#f_Rate').addEventListener('input', updHint);
  updHint();
  $('#f_Amount').addEventListener('input', () => { if (isCross()) recalcTo(); });
  $('#f_Rate').oninput = () => { M.rateAuto = false; if (isCross()) recalcTo(); };
  $('#f_ToAmount').oninput = () => {
    if (!isCross()) return;
    const a = calcVal('#f_Amount'), t = +$('#f_ToAmount').value;
    if (a && t) { $('#f_Rate').value = (curs()[0] === 'USD' ? t / a : a / t).toFixed(4); M.rateAuto = false; }
  };
  renderPhoto();
}

/* ----- exchange rates (history is kept) ----- */
function editRates(date) {
  const ex = D.Rates.find(r => r.Date === (date || today()));
  const v = ex || {Date: today(), Buy: buyRate(), Sell: sellRate()};
  openForm('USD exchange rate', 'Rates', [
    {k:'Date', l:'Effective date', t:'date', req:true},
    {k:'Buy', l:'Buying rate (1 USD = LKR)', t:'number', req:true},
    {k:'Sell', l:'Selling rate (1 USD = LKR)', t:'number', req:true}
  ], v, {noDelete: true, prep: o => { const e = D.Rates.find(r => r.Date === o.Date); if (e) o.ID = e.ID; }});
}
function showRates() {
  M = null;
  const rows = D.Rates.slice().sort((a, b) => String(a.Date) < String(b.Date) ? 1 : -1);
  $('#sheet').innerHTML = `<h3>Rate history</h3>` + (rows.length
    ? `<div class="item row mute"><span>Date</span><span>Buying · Selling</span></div>` +
      rows.map(r => `<div class="item row" onclick="editRates('${esc(r.Date)}')"><span>${esc(r.Date)}</span><b>${n2(r.Buy)} · ${n2(r.Sell)}</b></div>`).join('')
    : '<div class="empty">No history yet</div>') +
    `<div class="btns"><button class="btn ghost" onclick="closeM()">Close</button></div>`;
  $('#bd').style.display = 'block'; $('#sheet').style.display = 'block';
}

/* ----- bill photos ----- */
const PHOTO_HTML = `<div style="margin-bottom:12px"><div class="mute" style="margin-bottom:6px">Bill / receipt photo</div>
  <div id="photoBox"></div>
  <input id="photoFile" type="file" accept="image/*" style="display:none" onchange="pickPhoto(this)"></div>`;
const trash = id => google.script.run.withFailureHandler(() => {}).deletePhoto(id);
function renderPhoto(msg) {
  const b = $('#photoBox'); if (!b || !M) return;
  if (msg) { b.innerHTML = `<span class="mute">${msg}</span>`; return; }
  const has = M.v.Photo;
  b.innerHTML = `<div class="row" style="justify-content:flex-start;flex-wrap:wrap">` +
    (has ? `<button class="btn ghost sm" onclick="viewPhoto('${esc(has)}')">🖼 View</button><button class="btn del sm" onclick="removePhoto()">Remove</button>` : '') +
    `<button class="btn ghost sm" onclick="$('#photoFile').click()">📷 ${has ? 'Replace' : 'Take / choose photo'}</button></div>`;
}
function dropCurrent() {
  const p = M.v.Photo; if (!p) return;
  if (p === M.newPhoto) { trash(p); M.newPhoto = null; } else (M.toTrash = M.toTrash || []).push(p);
  M.v.Photo = '';
}
function removePhoto() { dropCurrent(); renderPhoto(); }
function resizeImage(file, max, q) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => rej(new Error('Could not read this image'));
    img.src = url;
  });
}
function pickPhoto(inp) {
  const f = inp.files[0]; inp.value = ''; if (!f) return;
  renderPhoto('Uploading…');
  resizeImage(f, 1280, 0.7).then(url => {
    google.script.run
      .withSuccessHandler(id => {
        if (!M) { trash(id); return; }
        dropCurrent(); M.v.Photo = id; M.newPhoto = id; renderPhoto();
      })
      .withFailureHandler(e => { alert('Upload failed: ' + e.message); renderPhoto(); })
      .uploadPhoto(url, 'bill-' + today());
  }).catch(e => { alert(e.message); renderPhoto(); });
}
function viewPhoto(id) {
  const v = $('#viewer'); v.style.display = 'flex'; v.innerHTML = '<div style="color:#fff">Loading…</div>';
  google.script.run
    .withSuccessHandler(src => { v.innerHTML = `<img src="${src}"><button class="btn" onclick="closeViewer()">Close</button>`; })
    .withFailureHandler(e => { v.style.display = 'none'; alert('Could not open photo: ' + e.message); })
    .getPhoto(id);
}
function closeViewer() { $('#viewer').style.display = 'none'; $('#viewer').innerHTML = ''; }

/* ----- other forms ----- */
const rid = () => (Math.random().toString(16) + '00000000').slice(2, 10);
function addToAcct() {                                       // add a category to the selected account's budget
  if (!budAcct) return;
  const free = D.Categories.filter(c => !D.AccBudgets.some(x => x.Account === budAcct && x.Category === c.Name));
  if (!free.length) { editCat(null, true); return; }
  const NEW = '＋ New category…', label = c => c.Name + (c.Type === 'Income' ? ' (income)' : '');
  openForm('Add category to ' + esc(budAcct), 'x', [{k:'Cat', l:'Category', t:'select', o: free.map(label).concat([NEW])}], {}, {
    noDelete: true,
    submit: o => { if (o.Cat === NEW) editCat(null, true); else { const c = free.find(x => label(x) === o.Cat); if (c) editAcctBudget(c.ID); } }
  });
}
const loanLabels = () => { const m = {}, seen = {};
  D.Loans.filter(l => l.Direction === 'Borrowed').forEach(l => { let lab = l.Person + (l.LoanType ? ' · ' + l.LoanType : '') + ' · ' + fmt(outstanding(l)) + ' left'; if (seen[lab]) lab += ' (' + l.ID.slice(0, 4) + ')'; seen[lab] = 1; m[lab] = l.ID; });
  return m; };
function editCat(id, forAcct) {
  const nid = forAcct ? rid() : '';
  const LM = loanLabels(), CM = {}; D.Accounts.filter(a => a.Type === 'Card').forEach(a => { CM[a.Name] = a.ID; });
  const labOf = (map, v) => Object.keys(map).filter(k => map[k] === v)[0] || '(none)';
  const cat0 = id ? D.Categories.find(c => c.ID === id) : null;
  const v = id ? Object.assign({}, cat0, {Budget: catBud(cat0, month), LoanID: labOf(LM, cat0.LoanID), CardID: labOf(CM, cat0.CardID)}) : {Type: 'Expense', LoanID: '(none)', CardID: '(none)'};
  const split = !!v.Name && D.AccBudgets.some(x => x.Category === v.Name);
  openForm(id ? 'Edit category' : 'New category', 'Categories', [
    {k:'Type', l:'Type', t:'select', o:['Expense','Income']},
    {k:'Name', l:'Name', req:true},
    {k:'Budget', l: split ? 'Monthly budget in LKR (total of its account budgets; change them in Budget)' : 'Monthly budget in LKR (income: monthly target)', t:'number', ro: split},
    {k:'LoanID', l:'Pays this loan (optional): expenses here count as a loan payment', t:'select', o:['(none)'].concat(Object.keys(LM))},
    {k:'CardID', l:'Pays this credit card (optional): expenses here reduce its balance', t:'select', o:['(none)'].concat(Object.keys(CM))}
  ], v, Object.assign({submit: o => { o.LoanID = LM[o.LoanID] || ''; o.CardID = CM[o.CardID] || ''; call('saveCategory', o, month); }}, forAcct ? {noDelete: true, prep: o => { o.ID = nid; }, reopen: 'acctbud:' + nid} : {}));
}
function editAcc(id) {
  const v = id ? D.Accounts.find(a => a.ID === id) : {Type: 'Bank', Currency: 'LKR'};
  const parents = [''].concat(D.Accounts.filter(a => a.ID !== (v && v.ID)).map(a => a.Name));
  openForm(id ? 'Edit account' : 'New account', 'Accounts', [
    {k:'Name', l:'Name', req:true},
    {k:'Currency', l:'Currency', t:'select', o:['LKR','USD']},
    {k:'Parent', l:'Sub-account of', t:'select', o:parents},
    {k:'Type', l:'Type', t:'select', o:['Cash','Bank','Card','Savings','Investment','Other']},
    {k:'Opening', l:'Opening balance (account currency). Enter what you owe as a negative number, e.g. a credit card', t:'number'},
    {k:'Target', l:'Target balance (optional, in account currency)', t:'number'},
    {k:'Limit', l:'Credit limit (credit cards only)', t:'number'},
    {k:'StmtDay', l:'Statement day of the month, 1–31 (credit cards only)', t:'number'},
    {k:'PayDay', l:'Payment due day of the month, 1–31 (credit cards only)', t:'number'}
  ], v);
}
function editGoal(id) {
  const v = id ? D.Goals.find(g => g.ID === id) : {};
  openForm(id ? 'Edit goal' : 'New goal', 'Goals', [
    {k:'Name', l:'Goal name', req:true},
    {k:'Target', l:'Target amount (LKR)', t:'number', req:true},
    {k:'Saved', l:'Saved so far (LKR)', t:'number'},
    {k:'TargetDate', l:'Target date', t:'date'}
  ], v);
}
function addToGoal(id) {
  const g = D.Goals.find(x => x.ID === id);
  const x = parseFloat(prompt('Amount to add to "' + g.Name + '" (LKR)'));
  if (!x) return;
  call('save', 'Goals', Object.assign({}, g, {Saved: (+g.Saved || 0) + x}));
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
call('getAll');
